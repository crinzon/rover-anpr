services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_PATH: /app/data/plates.db
    volumes:
      - ./data:/app/data
      - ./captures:/app/captures
    restart: unless-stopped

  camera:
    build:
      context: .
      dockerfile: docker/camera/Dockerfile
    env_file:
      - .env
    environment:
      API_URL: http://api:8000/plates
      DEVICE: cuda
      SHOW_WINDOW: "false"
    depends_on:
      - api
    volumes:
      - ./captures:/app/captures
    gpus: all
    restart: unless-stopped
